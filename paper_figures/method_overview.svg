  <text x="404" y="214" class="p">八项只读探针</text>
  <text x="404" y="252" class="p">阳性 / 阴性 / 不可用</text>
  <text x="404" y="289" class="p">已知根因真值</text>
  <path class="arr" d="M690 202H720"/>
  <rect class="card" x="730" y="78" width="300" height="250" rx="14"/>
  <rect x="730" y="78" width="300" height="8" rx="4" fill="#009E73"/>
  <text x="754" y="122" class="k">03 · 有限步选择</text>
  <text x="754" y="170" class="h">至多四次检查</text>
  <text x="754" y="214" class="p">优化固定 · 在线互信息</text>
  <text x="754" y="252" class="p">成本感知 · 失效域感知</text>
  <text x="754" y="289" class="p">后验置信度控制确诊</text>
  <path class="arr" d="M1040 202H1070"/>
  <rect class="card" x="1080" y="78" width="330" height="250" rx="14"/>
  <rect x="1080" y="78" width="330" height="8" rx="4" fill="#D55E00"/>
  <text x="1104" y="122" class="k">04 · 配对验证</text>
  <text x="1104" y="170" class="h">正确 · 误诊 · 升级</text>
  <text x="1104" y="214" class="p">工具路径逐例对比</text>
  <text x="1104" y="252" class="p">失效概率参数扫描</text>
  <text x="1104" y="289" class="p">时间块重采样区间</text>
  <rect x="30" y="365" width="660" height="78" rx="12" fill="#E8F3FA"/>
  <text x="52" y="397" class="k" fill="#0072B2">创新点 ①</text>
  <text x="52" y="425" class="p">在线策略何时可编译为路径等价的有限工作流？</text>
  <rect x="710" y="365" width="700" height="78" rx="12" fill="#E8F5F0"/>
  <text x="732" y="397" class="k" fill="#009E73">创新点 ②</text>
  <text x="732" y="425" class="p">“不可用”如何更新共享域可用率并改变下一项检查？</text>
  <text x="1408" y="466" text-anchor="end" class="n">故障与缺失为注入机制 · 非真实服务器事故</text>

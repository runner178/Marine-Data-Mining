<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="475" viewBox="0 0 1440 475">
  <defs>
    <style>
      text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17212B}
      .k{font-size:18px;fill:#5B6776;font-weight:600}.h{font-size:29px;font-weight:700}
      .p{font-size:20px;fill:#4D5666}.n{font-size:17px;fill:#657180}
      .card{fill:#FFFFFF;stroke:#C9D3DC;stroke-width:2}.arr{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#64748B"/></marker>
  </defs>
  <rect width="1440" height="475" fill="#FFFFFF"/>
  <text x="32" y="43" class="k">研究设计 · 数据与诊断链路</text>
  <rect class="card" x="30" y="78" width="300" height="250" rx="14"/>
  <rect x="30" y="78" width="300" height="8" rx="4" fill="#0072B2"/>
  <text x="54" y="122" class="k">01 · 真实背景</text>
  <text x="54" y="170" class="h">斯瓦尔巴 AIS</text>
  <text x="54" y="214" class="p">32 条轨迹 / 片段</text>
  <text x="54" y="252" class="p">2020 拟合 · 2021 校准</text>
  <text x="54" y="289" class="p">2022 独立测试</text>
  <path class="arr" d="M340 202H370"/>
  <rect class="card" x="380" y="78" width="300" height="250" rx="14"/>
  <rect x="380" y="78" width="300" height="8" rx="4" fill="#0072B2"/>
  <text x="404" y="122" class="k">02 · 可审计注入</text>
